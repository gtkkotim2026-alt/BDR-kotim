<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dinas Pendidikan Kotim - Adaptasi Pembelajaran Musim Kemarau 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="kotim_ikon.png">
<style>
  :root{
    --bg:#eef1f6; --card:#ffffff; --text:#1e293b; --muted:#64748b; --border:#e2e8f0;
    --accent:#2563eb; --accent-dark:#1d4ed8; --green:#16a34a; --green-bg:#dcfce7;
    --orange:#d97706; --orange-bg:#fef3c7;
    --shadow: 0 1px 2px rgba(15,23,42,0.06), 0 1px 6px rgba(15,23,42,0.06);
    --shadow-lg: 0 8px 24px rgba(15,23,42,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--text); padding:28px 20px;
  }
  .wrap{max-width:1180px; margin:0 auto;}

  header{
    display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-start; gap:16px;
    margin-bottom:24px; background:linear-gradient(135deg,#1d4ed8,#2563eb 60%,#3b82f6);
    color:#fff; border-radius:16px; padding:22px 26px; box-shadow:var(--shadow-lg);
  }
  h1{font-size:clamp(16px,2.4vw,21px); margin:0 0 4px 0; letter-spacing:.01em; font-weight:800;}
  h2{font-size:clamp(12px,1.8vw,14px); margin:0; color:rgba(255,255,255,0.85); font-weight:500;}
  .tanggal-hari{
    font-size:12.5px; font-weight:600; margin-top:10px; color:#fff; background:rgba(255,255,255,0.15);
    display:inline-block; padding:4px 12px; border-radius:20px;
  }
  .status-line{display:flex; align-items:center; gap:8px; font-size:12.5px; color:rgba(255,255,255,0.9); justify-content:flex-end;}
  .dot{width:8px; height:8px; border-radius:50%; background:#4ade80; display:inline-block; flex-shrink:0;}
  header button{
    background:#fff; color:var(--accent-dark); border:none; padding:9px 16px; border-radius:10px;
    font-size:13px; font-weight:600; cursor:pointer; margin-top:10px;
  }
  header button:hover{background:#f1f5f9;}

  .cards{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px;
    box-shadow:var(--shadow); transition:transform .15s ease;
  }
  .card .num{font-size:28px; font-weight:800; line-height:1;}
  .card .lbl{font-size:12.5px; color:var(--muted); margin-top:6px; font-weight:500;}

  .controls{
    display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; align-items:center;
    background:var(--card); padding:12px; border-radius:14px; box-shadow:var(--shadow);
  }
  input[type=text], select{
    padding:9px 14px; border:1px solid var(--border); border-radius:10px; font-size:13.5px;
    background:#fff; font-family:inherit; color:var(--text);
  }
  input[type=text]:focus, select:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .filter-btn{
    background:#f1f5f9; color:var(--text); border:1px solid transparent; padding:8px 14px;
    border-radius:20px; font-size:13px; font-weight:600; cursor:pointer; transition:.15s;
  }
  .filter-btn:hover{background:#e2e8f0;}
  .filter-btn.active{background:var(--accent); color:#fff;}

  .table-wrap{
    overflow-x:auto; border-radius:14px; box-shadow:var(--shadow); background:var(--card);
    -webkit-overflow-scrolling:touch;
  }
  table{width:100%; border-collapse:collapse; min-width:520px;}
  th,td{text-align:left; padding:12px 16px; font-size:13.5px; border-bottom:1px solid var(--border); white-space:nowrap;}
  th{background:#f8fafc; color:var(--muted); font-weight:700; text-transform:uppercase; font-size:10.5px; letter-spacing:.05em; position:sticky; top:0;}
  tbody tr:hover{background:#f8fafc;}
  tr:last-child td{border-bottom:none;}
  td:first-child, th:first-child{position:sticky; left:0; background:inherit; z-index:1;}
  tbody td:first-child{background:#fff;}
  tbody tr:hover td:first-child{background:#f8fafc;}

  .badge{display:inline-block; padding:4px 12px; border-radius:20px; font-size:12px; font-weight:700;}
  .badge.tm{background:var(--green-bg); color:var(--green);}
  .badge.bdr{background:var(--orange-bg); color:var(--orange);}
  .badge.unk{background:#f1f5f9; color:#94a3b8;}
  .badge.jenjang{background:#e0e7ff; color:#4338ca;}
  .badge.negeri{background:#dbeafe; color:#1d4ed8;}
  .badge.swasta{background:#fce7f3; color:#be185d;}
  .empty, .err{text-align:center; padding:44px 16px; color:var(--muted); font-size:14px;}
  .err{color:#b91c1c;}
  footer{margin-top:18px; text-align:center; font-size:12px; color:var(--muted);}
  code{background:#eef1f5; padding:1px 6px; border-radius:4px;}

  @media (max-width: 760px){
    body{padding:16px 12px;}
    header{flex-direction:column; align-items:stretch; padding:18px;}
    .status-line{justify-content:flex-start;}
    header > div:last-child{text-align:left !important;}
    .cards{grid-template-columns:repeat(2,1fr);}
    .card{padding:14px;}
    .card .num{font-size:22px;}
    .controls{flex-direction:column; align-items:stretch;}
    .controls > *{width:100%;}
    .controls .filter-btn{width:auto; flex:1;}
    #statusRowBtns{display:flex; gap:8px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>DINAS PENDIDIKAN KABUPATEN KOTAWARINGIN TIMUR</h1>
      <h2>Adaptasi Kegiatan Pembelajaran di Musim Kemarau Tahun 2026</h2>
    </div>
    <div style="text-align:right;">
      <p class="tanggal-hari" id="tanggalHariIni" style="margin:0 0 8px 0;">-</p>
      <div class="status-line"><span class="dot" id="statusDot"></span><span id="statusText">Memuat data…</span></div>
      <button id="refreshBtn" style="margin-top:6px;">Refresh sekarang</button>
    </div>
  </header>

  <div class="cards">
    <div class="card"><div class="num" id="cTotal">-</div><div class="lbl">Total Sekolah</div></div>
    <div class="card"><div class="num" id="cTM" style="color:var(--green)">-</div><div class="lbl">Tatap Muka</div></div>
    <div class="card"><div class="num" id="cBDR" style="color:var(--orange)">-</div><div class="lbl">BDR</div></div>
    <div class="card"><div class="num" id="cKec">-</div><div class="lbl">Kecamatan</div></div>
  </div>

  <div class="controls">
    <input type="text" id="searchBox" placeholder="Cari nama sekolah..." style="flex:1; min-width:180px;">
    <select id="kecFilter"><option value="">Semua Kecamatan</option></select>
    <select id="jenjangFilter">
      <option value="">Semua Jenjang</option>
      <option value="TK">TK</option>
      <option value="SD">SD</option>
      <option value="SMP">SMP</option>
      <option value="KB">KB</option>
      <option value="SKB">SKB</option>
    </select>
    <select id="statusJenjangFilter">
      <option value="">Semua Status</option>
      <option value="Negeri">Negeri</option>
      <option value="Swasta">Swasta</option>
    </select>
    <div id="statusRowBtns" style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="filter-btn active" data-status="">Semua</button>
      <button class="filter-btn" data-status="tm">Tatap Muka</button>
      <button class="filter-btn" data-status="bdr">BDR</button>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr id="theadRow">
          <th>Nama Sekolah</th>
          <th>Jenjang</th>
          <th>Status</th>
          <th>Kecamatan</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td class="empty">Memuat data...</td></tr>
      </tbody>
    </table>
  </div>

  <footer id="footerNote">Auto-refresh setiap 60 detik.</footer>
</div>

<script>
/* ============ KONFIGURASI ============
   1. Buka Google Sheets datanya.
   2. Klik "Bagikan" -> ubah akses jadi "Siapa saja yang memiliki link" (Pembaca/Viewer).
   3. Salin SHEET_ID dari URL: https://docs.google.com/spreadsheets/d/SHEET_ID_DI_SINI/edit
   4. Isi nama tab/sheet-nya di SHEET_NAME (nama tab di bagian bawah spreadsheet).
   5. Struktur kolom di spreadsheet:
      - Nama Sekolah  (wajib)
      - Kecamatan
      - Kolom-kolom hari, contoh: "Senin, 21/09/2026", "Selasa, 22/09/2026", dst.
        Kolom apa saja selain Nama Sekolah & Kecamatan otomatis dianggap kolom hari.
        Isi tiap sel dengan "Tatap Muka" atau "BDR".

   Jenjang & Status Negeri/Swasta dideteksi OTOMATIS dari Nama Sekolah, tidak perlu kolom tambahan:
      - Jenjang: TK, SD, SMP, KB, SKB (dibaca dari awalan nama sekolah)
      - Status Negeri:
          TK Negeri : mengandung "TK N" atau "TK Negeri"
          SD Negeri : mengandung "SDN", "SD Negeri", atau "SD - Negeri"
          SMP Negeri: mengandung "SMPN" atau "SMP Negeri"
          Selain pola di atas -> dianggap Swasta
======================================== */
const CONFIG = {
  sheetId: "1N_I7PkqLgj3yEYRdGAZHIsr_sMa4cxlOTG67TdFpeF0",
  sheetName: "Sheet1",
  refreshInterval: 60000 // 60 detik
};

let allRows = [];
let dayColumns = [];
let activeStatus = "";
let selectedDay = "";

function csvUrl(){
  return `https://docs.google.com/spreadsheets/d/${CONFIG.sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(CONFIG.sheetName)}&_=${Date.now()}`;
}

function findKey(row, candidates){
  const keys = Object.keys(row);
  for(const c of candidates){
    const hit = keys.find(k => k.trim().toLowerCase() === c);
    if(hit) return hit;
  }
  for(const c of candidates){
    const hit = keys.find(k => k.trim().toLowerCase().includes(c));
    if(hit) return hit;
  }
  return null;
}

function normalizeStatus(v){
  if(!v) return "unk";
  const s = v.toString().trim().toLowerCase();
  if(s.includes("tatap") || s === "tm") return "tm";
  if(s.includes("bdr") || s.includes("daring") || s.includes("rumah")) return "bdr";
  return "unk";
}

// Deteksi jenjang dari nama sekolah (SKB & SMP dicek lebih dulu supaya tidak salah tangkap oleh KB/SD)
function detectJenjang(nama){
  const s = (nama || "").toString().trim().toUpperCase();
  if(s.startsWith("SKB")) return "SKB";
  if(s.startsWith("SMP")) return "SMP";
  if(s.startsWith("SD")) return "SD";
  if(s.startsWith("TK")) return "TK";
  if(s.startsWith("KB")) return "KB";
  return "-";
}

// Deteksi status Negeri/Swasta dari nama sekolah
function detectStatusJenjang(nama){
  const s = (nama || "").toString().trim().toUpperCase();
  // TK Negeri: "TK N", "TK NEGERI"
  if(/\bTK\s*N\b/.test(s) || s.includes("TK NEGERI")) return "Negeri";
  // SD Negeri: "SDN", "SD NEGERI", "SD - NEGERI"
  if(s.includes("SDN") || s.includes("SD NEGERI") || s.includes("SD - NEGERI") || s.includes("SD-NEGERI")) return "Negeri";
  // SMP Negeri: "SMPN", "SMP NEGERI"
  if(s.includes("SMPN") || s.includes("SMP NEGERI")) return "Negeri";
  // fallback umum untuk KB/SKB atau pola lain yang eksplisit menyebut "NEGERI"
  if(s.includes("NEGERI")) return "Negeri";
  return "Swasta";
}

function tanggalHariIniText(){
  return new Date().toLocaleDateString("id-ID", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
}

function tanggalDDMMYYYY(){
  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
}

async function loadData(){
  document.getElementById("tanggalHariIni").textContent = tanggalHariIniText();
  const dot = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");
  statusText.textContent = "Memuat data...";
  dot.style.background = "#d97706";

  try{
    const res = await fetch(csvUrl(), {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    const parsed = Papa.parse(text, {header:true, skipEmptyLines:true});
    if(!parsed.data.length) throw new Error("Sheet kosong atau kolom tidak terbaca");

    const sample = parsed.data[0];
    const kName = findKey(sample, ["nama sekolah","sekolah","nama"]);
    const kKec = findKey(sample, ["kecamatan","kec"]);
    dayColumns = Object.keys(sample).filter(k => k !== kName && k !== kKec && k.trim() !== "");

    allRows = parsed.data
      .filter(r => kName && r[kName] && r[kName].toString().trim() !== "")
      .map(r => {
        const hari = {};
        dayColumns.forEach(d => {
          hari[d] = { raw: r[d] || "", status: normalizeStatus(r[d]) };
        });
        const nama = kName ? r[kName] : "-";
        return {
          nama: nama,
          kecamatan: kKec ? (r[kKec]||"").toString().trim() : "-",
          jenjang: detectJenjang(nama),
          statusJenjang: detectStatusJenjang(nama),
          hari
        };
      });

    populateKecFilter();
    tentukanSelectedDay();
    render();

    const now = new Date();
    statusText.textContent = "Terakhir sinkron: " + now.toLocaleTimeString("id-ID");
    dot.style.background = "var(--green)";
  }catch(err){
    console.error(err);
    statusText.textContent = "Gagal memuat data";
    dot.style.background = "#dc2626";
    document.getElementById("tbody").innerHTML =
      `<tr><td colspan="12" class="err">Gagal mengambil data dari Google Sheets.<br>
      Pastikan SHEET_ID benar dan sharing sudah "Siapa saja yang memiliki link".<br>
      <code>${err.message}</code></td></tr>`;
  }
}

function daftarKecamatanUnik(rows){
  const map = new Map();
  rows.forEach(r=>{
    const key = (r.kecamatan||"").trim().toUpperCase();
    if(key && !map.has(key)) map.set(key, r.kecamatan.trim());
  });
  return [...map.values()].sort();
}

function populateKecFilter(){
  const sel = document.getElementById("kecFilter");
  const current = sel.value;
  const kecs = daftarKecamatanUnik(allRows);
  sel.innerHTML = '<option value="">Semua Kecamatan</option>' + kecs.map(k=>`<option value="${k}">${k}</option>`).join("");
  sel.value = current;
}

function tentukanSelectedDay(){
  if(dayColumns.includes(selectedDay)) return; // sudah valid, pertahankan
  const todayStr = tanggalDDMMYYYY();
  const kolomHariIni = dayColumns.find(d => d.includes(todayStr));
  selectedDay = kolomHariIni || dayColumns[0] || "";
}

function render(){
  const search = document.getElementById("searchBox").value.trim().toLowerCase();
  const kec = document.getElementById("kecFilter").value;
  const jenjang = document.getElementById("jenjangFilter").value;
  const statusJenjang = document.getElementById("statusJenjangFilter").value;

  const filtered = allRows.filter(r=>{
    if(kec && (r.kecamatan||"").trim().toUpperCase() !== kec.trim().toUpperCase()) return false;
    if(search && !r.nama.toLowerCase().includes(search)) return false;
    if(jenjang && r.jenjang !== jenjang) return false;
    if(statusJenjang && r.statusJenjang !== statusJenjang) return false;
    if(activeStatus && selectedDay && (!r.hari[selectedDay] || r.hari[selectedDay].status !== activeStatus)) return false;
    return true;
  });

  document.getElementById("cTotal").textContent = filtered.length;
  document.getElementById("cTM").textContent = filtered.filter(r=>selectedDay && r.hari[selectedDay] && r.hari[selectedDay].status==="tm").length;
  document.getElementById("cBDR").textContent = filtered.filter(r=>selectedDay && r.hari[selectedDay] && r.hari[selectedDay].status==="bdr").length;
  document.getElementById("cKec").textContent = daftarKecamatanUnik(allRows).length;

  const theadRow = document.getElementById("theadRow");
  theadRow.innerHTML = '<th>Nama Sekolah</th><th>Jenjang</th><th>Status</th><th>Kecamatan</th>' + dayColumns.map(d=>`<th>${d}</th>`).join("");

  const tbody = document.getElementById("tbody");
  if(!filtered.length){
    tbody.innerHTML = `<tr><td colspan="${4+dayColumns.length}" class="empty">Tidak ada data yang cocok.</td></tr>`;
    return;
  }
  function badgeHtml(cell){
    if(!cell || !cell.raw) return '<span class="badge unk">-</span>';
    const cls = cell.status === "tm" ? "tm" : cell.status === "bdr" ? "bdr" : "unk";
    const label = cell.status === "tm" ? "Tatap Muka" : cell.status === "bdr" ? "BDR" : cell.raw;
    return `<span class="badge ${cls}">${label}</span>`;
  }
  tbody.innerHTML = filtered.map(r=>{
    const dayCells = dayColumns.map(d => `<td>${badgeHtml(r.hari[d])}</td>`).join("");
    const statusCls = r.statusJenjang === "Negeri" ? "negeri" : "swasta";
    return `<tr>
      <td>${r.nama}</td>
      <td><span class="badge jenjang">${r.jenjang}</span></td>
      <td><span class="badge ${statusCls}">${r.statusJenjang}</span></td>
      <td>${r.kecamatan || "-"}</td>
      ${dayCells}
    </tr>`;
  }).join("");
}

document.getElementById("searchBox").addEventListener("input", render);
document.getElementById("kecFilter").addEventListener("change", render);
document.getElementById("jenjangFilter").addEventListener("change", render);
document.getElementById("statusJenjangFilter").addEventListener("change", render);
document.getElementById("refreshBtn").addEventListener("click", loadData);
document.querySelectorAll(".filter-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    activeStatus = btn.dataset.status;
    render();
  });
});

loadData();
setInterval(loadData, CONFIG.refreshInterval);
</script>
</body>
</html>
